name: Build & Release

# 打 tag（v0.1.0 这种）就出两平台安装包并挂到 GitHub Release；
# 手动触发只跑构建、不建 Release，用来验证「换台机器能不能打包」。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ Windows
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 走项目自己的脚本，别在 CI 里另写一套 PyInstaller 参数 ——
      # 否则「本地能打、CI 打出来不一样」这种问题永远查不清。
      - name: 打包（便携目录）
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build_windows.ps1

      # 用产物本体跑自检：渲染一帧离屏图统计非透明像素（详见 main.py --self-check）。
      # 退出码非 0 = 覆盖层画不出任何东西，直接让这次构建红掉。
      - name: 自检（渲染内容）
        shell: pwsh
        run: |
          & "dist\windows\roachHub\roachHub.exe" --self-check
          "self-check rc=$LASTEXITCODE"
          if ($LASTEXITCODE -ne 0) { Get-Content "dist\windows\roachHub\logs\roachHub.log" -Tail 25 -ErrorAction SilentlyContinue; exit 1 }

      - name: 压缩成 zip
        shell: pwsh
        run: |
          $src = "dist\windows\roachHub"
          if (-not (Test-Path $src)) { throw "构建产物缺失: $src" }
          # 连文件夹一起压：解压出来就是 roachHub\，不会把上百个 dll 撒在下载目录里
          Compress-Archive -Path $src -DestinationPath "dist\roachHub-windows-x64.zip" -Force
          Get-Item "dist\roachHub-windows-x64.zip" | ForEach-Object { "    {0:N1} MB" -f ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/roachHub-windows-x64.zip
          if-no-files-found: error

  # -------------------------------------------------------------------- macOS
  macos:
    name: macOS (universal2)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # universal2 要求解释器和所有依赖都是双架构。PySide6 的 macOS wheel 是
      # universal2，但 setup-python 装出来的解释器不一定 —— 失败就退回当前
      # runner 的原生架构（macos-latest 现在是 arm64），至少 Apple Silicon 能用。
      - name: 打包（dmg）
        run: |
          chmod +x packaging/build_macos.sh
          if ! bash packaging/build_macos.sh --arch universal2; then
            echo "::warning::universal2 构建失败，回退为 runner 原生架构"
            bash packaging/build_macos.sh
          fi

      # ★ mac 包的命门检查（v0.1.0 就是死在这）：渲染内容 + WindowServer 视角
      # 反查覆盖层窗口。在 Windows 上永远复现不了这类问题，必须在这台真 mac 上验。
      - name: 自检（覆盖层可见性 + 渲染内容）
        run: |
          BIN="dist/macos/roachHub.app/Contents/MacOS/roachHub"
          "$BIN" --self-check
          rc=$?
          LOG="$HOME/Library/Application Support/roachHub/logs/roachHub.log"
          [ -f "$LOG" ] && grep -E "self-check|窗口层级|鼠标穿透|覆盖窗口" "$LOG" | tail -12 || true
          exit $rc

      - name: 按实际架构命名
        id: name
        run: |
          BIN="dist/macos/roachHub.app/Contents/MacOS/roachHub"
          ARCHS="$(lipo -archs "$BIN" 2>/dev/null | tr ' ' '_' || echo unknown)"
          OUT="dist/roachHub-macos-${ARCHS}.dmg"
          cp "dist/macos/roachHub.dmg" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"
          echo "    产物: $OUT（$ARCHS）"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error

  # Intel Mac 单独跑一个：universal2 在 arm64 runner 上做不出来（解释器不是
  # 双架构），只能用 x86_64 的 runner 原生构建。continue-on-error 是刻意的：
  # 这个镜像万一不可用，也不能把 Windows / Apple Silicon 的发布一起拖死。
  macos-intel:
    name: macOS (x86_64)
    runs-on: macos-26-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 打包（dmg）
        run: |
          chmod +x packaging/build_macos.sh
          bash packaging/build_macos.sh

      - name: 自检（覆盖层可见性 + 渲染内容）
        run: |
          BIN="dist/macos/roachHub.app/Contents/MacOS/roachHub"
          "$BIN" --self-check
          rc=$?
          LOG="$HOME/Library/Application Support/roachHub/logs/roachHub.log"
          [ -f "$LOG" ] && grep -E "self-check" "$LOG" | tail -8 || true
          exit $rc

      - name: 重命名
        id: name
        run: |
          BIN="dist/macos/roachHub.app/Contents/MacOS/roachHub"
          ARCHS="$(lipo -archs "$BIN" 2>/dev/null | tr ' ' '_' || echo x86_64)"
          OUT="dist/roachHub-macos-${ARCHS}.dmg"
          cp "dist/macos/roachHub.dmg" "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-intel
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error

  # ------------------------------------------------------------------ Release
  # 单独一个 job 汇总：两个构建 job 同时往同一个 Release 挂文件会打架。
  release:
    name: 发布 Release
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, macos-intel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true      # 三个包放进同一个目录，附件名互不覆盖

      - name: 列出附件
        run: find artifacts -type f -printf '%p  %k KB\n'

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            ## 下载

            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows 10/11 x64 | `roachHub-windows-x64.zip` | 解压后双击 `roachHub.exe`，整个文件夹一起拷走 |
            | macOS Apple Silicon（M 系列） | `roachHub-macos-arm64.dmg` | 打开后把 `roachHub` 拖进「应用程序」 |
            | macOS Intel | `roachHub-macos-x86_64.dmg` | 同上（只有拿 Intel 机器的构建成功时才会有） |

            **首次打开**：包没有做 Apple 公证 / Windows 代码签名，系统会拦一次。

            - macOS：右键 App →「打开」，或终端执行 `xattr -cr /Applications/roachHub.app`
            - Windows：SmartScreen 提示 →「更多信息」→「仍要运行」

            配置与日志位置：Windows 在 exe 旁边；macOS 在 `~/Library/Application Support/roachHub`。
